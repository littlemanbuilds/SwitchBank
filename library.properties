sentence=Debounced 1..32-bit switch banks with explicit input validity and coherent packed reads.
paragraph=Header-only, Arduino-friendly switch-bank library for GPIO and expander-backed DIP, mode and selector inputs. Provides per-bit debounce, active-low/high normalization, coherent packed acquisition, explicit read-failure semantics, freshness/change metadata, durable sequence counters, edge helpers, and zero dynamic allocation. ESP32-S3 is the primary project target; portable compile gates cover AVR, megaAVR, SAMD, ESP32, ESP8266, RP2040, Teensy and STM32.
category=Signal Input/Output
